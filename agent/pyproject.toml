# Owned by P1. Ask P1 to add dependencies; everything the team needs is pre-installed here.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "teleport"
version = "0.1.0"
description = "Teleport device agent: migrate or remote-access running workloads across devices"
requires-python = ">=3.11"
dependencies = [
  # runtime
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "pydantic>=2.7",
  "psutil>=5.9",
  "cryptography>=42",
  "aiosqlite>=0.20",
  "PyYAML>=6",
  "mss>=9",
  "Pillow>=10.3",
  "pynput>=1.7",
  "httpx>=0.27",
  "qrcode>=7.4",
  # dev, test and lint (installed with the package so `pip install -e agent` is all you need)
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-psutil",
  "types-PyYAML",
]

[project.scripts]
teleport = "teleport.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["teleport"]

[tool.hatch.build]
# Editable installs put agent/ and the repo root on sys.path so `contract` (repo-root/contract) imports.
dev-mode-dirs = [".", ".."]
