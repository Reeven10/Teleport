[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
files = .
mypy_path = .:agent:sdk
explicit_package_bases = True
namespace_packages = True
# The P3 files below import `agent.teleport...`, which loads teleport twice (issue P3-1), or are
# not strictly typed (P3-2). Remove them from this list once fixed.
exclude = (?x)(
    (^|/)(node_modules|\.venv|ui|\.teleport-dev|\.git)/
    | dev/feasibility/cli\.py$
    | tests/feasibility/test_(checks|engine|cli)\.py$
    | tests/feasibility/fixtures/__init__\.py$
    | tests/history/test_history\.py$
  )

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-mss.*,pynput.*,qrcode.*]
ignore_missing_imports = True
