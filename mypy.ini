[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
files = .
mypy_path = .:agent:sdk
explicit_package_bases = True
namespace_packages = True
exclude = (^|/)(node_modules|\.venv|ui|\.teleport-dev|\.git)/

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-mss.*,pynput.*,qrcode.*]
ignore_missing_imports = True
